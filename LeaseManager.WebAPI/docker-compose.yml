version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: leasemanager-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - leasemanager-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrongPassword123!" -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 5

  # LeaseManager API
leasemanager-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: leasemanager-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Initial Catalog=LeaseManagerDB;User Id=sa;Password=YourStrongPassword123!;Encrypt=False;Trust Server Certificate=True;"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - leasemanager-network
    volumes:
      - ./logs:/app/logs

networks:
  leasemanager-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local